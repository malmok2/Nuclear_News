name: Daily nuclear news brief

on:
  schedule:
    # 20:30 UTC = 05:30 KST. GitHub cron can start up to ~1 h late, so the page is up before ~07:00 KST.
    - cron: "30 20 * * *"
    # Safety net at 09:00 KST: runs only if the morning run failed or published without commentary.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Day to build (YYYY-MM-DD, KST). Empty = today"
        required: false
      force:
        description: "Rebuild even if that day is already published"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.guard.outputs.skip != 'true' }}
    env:
      TZ: Asia/Seoul
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NEWS_MODEL: ${{ vars.NEWS_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Skip if today already succeeded (scheduled runs only)
        id: guard
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          done=$(python -c "import json; s=json.load(open('state/latest-run.json')); print(int(s.get('status')=='success' and s.get('run_date')=='$today'))" 2>/dev/null || echo 0)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$done" = "1" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Run pipeline
        if: steps.guard.outputs.skip != 'true'
        run: |
          args=""
          [ -n "${{ inputs.date }}" ] && args="$args --date ${{ inputs.date }}"
          [ "${{ inputs.force }}" = "true" ] && args="$args --force"
          python -m pipeline.run_daily $args

      - name: Commit data and site
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data state docs
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "원자력 뉴스 브리핑 $(python -c "import json; s=json.load(open('state/latest-run.json')); print(s['run_date'], s['status'])")"
          git push

      - name: Upload Pages artifact
        if: success() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: brief
    if: needs.brief.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
